# SonarQube analysis config for SpenDrop (local Community Build server; run `sonar-scan`
# from this directory). No secrets here — the token and host come from the environment.
#
# Sources and tests both start at the repo root; the scanner makes them disjoint by
# turning sonar.test.inclusions into source exclusions automatically (documented
# behaviour for colocated tests). Generated code is excluded so it never counts as debt.
# NOTE: sonar.exclusions filters the SOURCE scope only — vendored test fixtures under
# node_modules must be dropped from the TEST scope with sonar.test.exclusions.
# web/src/components/ui/** is analysed on purpose (decided 2026-08-16): 17 of its 32 shadcn
# primitives carry SpenDrop edits (sheet/dialog heights, select, switch, table, chart, sonner,
# the bespoke password-input), so it is not vendored code. .github/** stays excluded only
# because this server has no GitHub Actions analyzer — revisit when it does.

sonar.projectKey=spendrop
sonar.projectName=SpenDrop
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=**/node_modules/**,web/dist/**,dist/**,.playwright-mcp/**,.claude/**

sonar.exclusions=\
  **/node_modules/**,web/dist/**,dist/**,.playwright-mcp/**,.claude/**,\
  **/__snapshots__/**,\
  logo/**,**/*.png,**/*.ico,**/*.svg,\
  internal/database/db.go,internal/database/models.go,internal/database/queries.sql.go,\
  docs/**,.github/**,\
  web/src/test/**,internal/api/testdata/**

# TypeScript: tsconfig files are auto-detected (web/tsconfig.json references
# tsconfig.app.json / tsconfig.node.json); a few root-level config scripts fall back to
# default compiler options either way. Uncomment to pin explicitly:
# sonar.typescript.tsconfigPaths=web/tsconfig.app.json,web/tsconfig.node.json

# Coverage. `make coverage` (repo root) writes these files; the `sonar-scan` wrapper
# runs it before every upload. Without them the Zero Coverage Sensor reports 0% and the
# "Sonar way" gate (new coverage < 80% → FAIL) is red on every PR.
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# Test execution (the "Unit Tests" count / pass density / duration — a separate channel
# from coverage): the `go test -json` stream, and vitest-sonar-reporter's Generic Test
# Execution XML (file paths already repo-root-relative).
sonar.go.tests.reportPaths=go-test-report.json
sonar.testExecutionReportPaths=web/coverage/sonar-report.xml
# Not coverable code: bundle/service-worker entry points, the vitest setup, the
# palette script, the two tiny Go CLIs, and the frontend tool configs.
sonar.coverage.exclusions=\
  web/src/main.tsx,web/src/sw.ts,web/src/test/**,web/scripts/**,\
  web/*.config.*,cmd/vapidgen/**,cmd/schema-doc/**
