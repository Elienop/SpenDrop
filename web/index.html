<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the dark theme --background in src/globals.css. The PWA plugin
         injects <link rel="manifest"> automatically but not theme-color. -->
    <meta name="theme-color" content="#111113" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpenDrop" />
    <title>SpenDrop</title>
    <!-- Pre-paint theme init. External (not inline) so it executes under the
         server's strict CSP (`script-src 'self'`, no 'unsafe-inline'). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
