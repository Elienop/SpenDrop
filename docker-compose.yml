services:
  spendrop:
    image: ghcr.io/elienop/spendrop:latest
    container_name: spendrop
    ports:
      - "3535:8080"
    volumes:
      - spendrop-data:/app/data
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=8080
      - DB_PATH=/app/data/spendrop.db
    restart: unless-stopped

volumes:
  spendrop-data:
