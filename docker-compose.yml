services:
  spendrop:
    image: ghcr.io/elienop/spendrop:latest
    container_name: spendrop
    ports:
      - "3535:8080"
    volumes:
      - spendrop-data:/app/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Soft memory ceiling for the Go runtime, deliberately BELOW mem_limit
      # (see the bottom of this service). It is what turns a memory spike into
      # slowness instead of a kill: past this figure the garbage collector runs
      # harder rather than letting the heap grow, so mem_limit is only ever
      # reached by something the collector genuinely cannot reclaim. Raise the
      # two together or not at all — a soft limit at or above the hard one does
      # nothing.
      - GOMEMLIMIT=768MiB
      # Cookie security mode. Default "auto" detects from the request scheme.
      # Set to "true" when behind an HTTPS reverse proxy (with TRUST_PROXY=true).
      # Set to "false" for plain-HTTP LAN deployments.
      # - COOKIE_SECURE=auto
      # - TRUST_PROXY=true
      # CORS origin for split-origin deployments. Leave unset for same-origin.
      # - CORS_ORIGIN=https://spendrop.example.com
      # Scheduled backups. Default: enabled, every 24h, 7/4/12 GFS retention.
      # - BACKUP_ENABLED=true
      # - BACKUP_INTERVAL=24h
      # - BACKUP_KEEP_DAILY=7
      # - BACKUP_KEEP_WEEKLY=4
      # - BACKUP_KEEP_MONTHLY=12
      # --- Web Push (optional, default OFF) ---------------------------------
      # Leave PUSH_ENABLED unset/false to keep push fully inert. To enable,
      # generate a VAPID keypair once — on any Docker host, no Go/Node install:
      #   docker run --rm node:22-alpine npx -y web-push generate-vapid-keys
      # (or `npx web-push generate-vapid-keys`, or `go run ./cmd/vapidgen`) —
      # then set all three keys + a subject.
      # ROTATING THESE KEYS INVALIDATES EVERY EXISTING SUBSCRIPTION — every
      # device must re-enable notifications afterward. See README → Notifications.
      # - PUSH_ENABLED=true
      # - VAPID_PUBLIC_KEY=<base64url P-256 public key>
      # - VAPID_PRIVATE_KEY=<base64url P-256 private key>
      # - VAPID_SUBJECT=mailto:you@example.com
    restart: unless-stopped

    # Hard memory ceiling. Its job is blast radius, not thrift: without it a
    # runaway allocation grows until the HOST is out of memory, and the kernel
    # then picks a victim by badness score — which is not guaranteed to be
    # SpenDrop. On a NAS running other services, that means this app can get
    # something else killed. With it, the kernel kills only this container and
    # `restart: unless-stopped` brings it back in seconds.
    #
    # Nothing durable is at risk when that happens: an import writes nothing
    # until you confirm, and confirming is a single transaction, so SQLite is
    # left at the last committed state. The cost is an in-flight import preview.
    #
    # SIZED FROM MEASUREMENT, AND THE TRAP IS SETTING IT TOO LOW — a limit under
    # ~250 MiB starts killing ordinary Excel exports. Peak live heap, measured
    # 2026-08-01:
    #
    #   export, 50,000 rows (MaxExportRows)   208 MiB   <-- the real worst case
    #   import, 10,000 rows (MaxImportRows)    41 MiB
    #   import, a realistic Google Sheets file  6-9 MiB
    #
    # Export is the one that matters: it builds the whole workbook in memory and,
    # unlike import, is reachable by any household member with an ordinary GET.
    # Two members exporting a full ledger at once is ~416 MiB, which is unlikely
    # but legitimate and must not be killed. 1 GiB clears that with room for the
    # base process and SQLite's cache, and is still small for a TrueNAS box.
    #
    # Before lowering this, check the export path first, not the import path.
    mem_limit: 1g

volumes:
  spendrop-data:
