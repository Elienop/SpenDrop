# CI Gates — the single source of truth for the project's build/test/lint
# gates. Invoked via `workflow_call` by BOTH pr.yml (on pull_request) and
# main.yml (on push to main, before the release job). Any gate added here is
# automatically enforced on every PR and on every push-to-main release, so the
# two paths can never drift (previously main.yml only ran `go test -race`).
name: CI Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Schema docs up-to-date
        run: |
          # The drift check runs before `go test` so a stale docs/SCHEMA.md
          # fails fast (~1s) instead of waiting out the race-enabled test
          # suite. The `git ls-files` guard is a defense against the
          # docs/SCHEMA.md file being removed from the tree entirely —
          # `git diff --exit-code` silently passes on an untracked file,
          # which would let a drifted file sneak through on its own.
          make docs
          if ! git diff --exit-code docs/SCHEMA.md; then
            echo '::error::docs/SCHEMA.md is stale — run `make docs` and commit the result'
            exit 1
          fi
          if ! git ls-files --error-unmatch docs/SCHEMA.md >/dev/null 2>&1; then
            echo '::error::docs/SCHEMA.md is not tracked — commit it'
            exit 1
          fi

      - name: Test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npx vitest run

      - name: Lint
        run: npx eslint .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built WITH a version stamp so every PR exercises the same build shape
      # the release uses. vCI-0.0.0-ci is a throwaway sentinel, deliberately
      # shaped to be unmistakable: the bundle half of the check below is a
      # substring grep over minified JS, and a short value like "vCI" could
      # one day appear inside a hash, a chunk name, or a dependency's string
      # table and pass by coincidence. It also must not look like a real
      # release, so nobody mistakes a CI image for a published one.
      #
      # It intentionally does NOT satisfy the v<major>.<minor>.<patch> guard
      # in main.yml — that guard exists because the release path feeds a real
      # tag into -ldflags, and it is scoped to that workflow. This value never
      # reaches it.
      - name: Build image
        run: docker build --build-arg APP_VERSION=vCI-0.0.0-ci -t spendrop:ci .

      # Passing --build-arg is not by itself worth much: a build with no arg
      # already runs the same ARG -> -ldflags plumbing, just with the value
      # "dev". What this asserts is the part no other test can reach — that a
      # real image, built the way a release is built, actually carries the
      # version it was handed.
      #
      # The failure mode being guarded is silent by construction. Renaming the
      # Dockerfile ARG, or typoing the -X symbol path, produces a successful
      # build and a working image that reports "dev" for every release; Docker
      # only *warns* about a build-arg nothing consumed, it does not fail. The
      # Go tests pin the Dockerfile's text, so this is the end-to-end backstop
      # for a break that somehow satisfies them.
      #
      # Both artifacts are checked separately so a failure names which one
      # drifted. "Binary has it, bundle does not" is the exact shape of the
      # no-drift invariant breaking, and a combined check would report it as
      # an indistinguishable red.
      #
      # The binary is checked by RUNNING it, not by grepping it. Grepping is
      # actively misleading here: Go embeds the full -ldflags string as a build
      # setting inside every binary (that is what `go version -m` reads back),
      # so the version text is present in the file whether or not the linker
      # patched the variable. A grep passes on a binary whose -X symbol path is
      # typo'd — precisely the regression this step exists to catch. Only
      # executing the binary reads the variable the server itself reads.
      #
      # --entrypoint /app/spendrop bypasses entrypoint.sh, which would
      # otherwise chown the data dir and drop privileges first; none of that is
      # needed to print a string. The bundle has no equivalent of an executable
      # self-report, so it stays a grep — sound there, because Vite inlines the
      # value into the emitted JS as a literal and nothing else in the image
      # would contain it.
      - name: Image reports the version it was built with
        run: |
          reported="$(docker run --rm --entrypoint /app/spendrop spendrop:ci -version)"
          if [ "$reported" != "vCI-0.0.0-ci" ]; then
            echo "::error::The Go binary reports its version as '$reported', expected 'vCI-0.0.0-ci'. The build arg reached the go build command line but the linker did not patch the variable — check the -ldflags -X symbol path in the Dockerfile against the package path and variable name in internal/version, and that the ARG is still named APP_VERSION."
            exit 1
          fi
          if ! docker run --rm --entrypoint sh spendrop:ci -c 'grep -rq vCI-0.0.0-ci /app/web/dist'; then
            echo '::error::The frontend bundle does not carry its APP_VERSION while the binary does — the two artifacts in this image disagree about what version they are. Check that the web-builder stage still sets ENV VITE_APP_VERSION=${APP_VERSION} and that the frontend still reads import.meta.env.VITE_APP_VERSION (Vite only inlines VITE_-prefixed vars, and only where the value is actually referenced).'
            exit 1
          fi

      # The README's restore drill is performed with the container stopped, by
      # a root process writing straight into the data volume. The restored
      # spendrop.db therefore lands root-owned inside an /app/data whose own
      # ownership is already correct, and the server — which runs as PUID:PGID
      # — then cannot open its own database. That failure surfaces on exactly
      # the boot an operator is least equipped to debug: mid-restore, with the
      # app already down and the backup apparently in place.
      #
      # No Go test can reach this. entrypoint.sh is shell, it needs root and a
      # real volume to do anything observable, and the bug is invisible to any
      # check that only inspects the data directory.
      #
      # Both halves are asserted because a naive fix satisfies only one. Making
      # the guard correct is easy if you drop it and `chown -R` unconditionally
      # — but that sweep is O(files) and grows with every backup and migration
      # snapshot, so it is a boot-time regression on a large volume that
      # nothing else here would catch. The guard has to fire on a wrong-owned
      # database AND stay quiet on a healthy boot.
      - name: Entrypoint makes a restored database openable
        run: |
          vol="spendrop-restore-drill-${GITHUB_RUN_ID}"
          # The Actions shell runs with -e, so any docker failure below aborts
          # the step mid-way. Clean up from a trap rather than inline, or a red
          # run leaves the volume behind on the host.
          trap 'docker volume rm "$vol" >/dev/null 2>&1 || true' EXIT
          docker volume create "$vol" >/dev/null

          # Reproduce the post-restore state: correctly-owned directories, a
          # root-owned database, and a root-owned sentinel deep inside
          # backups/ that ONLY a recursive sweep would ever touch.
          docker run --rm -v "$vol":/app/data alpine:3.20 sh -c '
            mkdir -p /app/data/backups /app/data/migration-snapshots
            echo restored > /app/data/spendrop.db
            echo sentinel > /app/data/backups/sentinel.db
            chown 1000:1000 /app/data /app/data/backups /app/data/migration-snapshots
            chown 0:0 /app/data/spendrop.db /app/data/backups/sentinel.db'

          # Boot 1: the real invariant is not "the uid changed", it is "the
          # app user can write the database", so probe it with a write.
          write_rc=0
          docker run --rm -e PUID=1000 -e PGID=1000 -v "$vol":/app/data spendrop:ci \
            sh -c 'echo probe >> /app/data/spendrop.db' || write_rc=$?

          # Boot 1 swept the sentinel along with everything else. Put it back
          # so boot 2 starts from a state where every path the guard probes is
          # already correct.
          docker run --rm -v "$vol":/app/data alpine:3.20 \
            chown 0:0 /app/data/backups/sentinel.db

          sentinel="$(docker run --rm -e PUID=1000 -e PGID=1000 -v "$vol":/app/data spendrop:ci \
            stat -c '%u:%g' /app/data/backups/sentinel.db | tail -n 1)"

          # The capture above is piped into `tail`, so a failed `docker run`
          # yields an empty string rather than a nonzero status. Without this
          # the next assertion reports it as an ownership regression.
          if [ -z "$sentinel" ]; then
            echo "::error::Could not read the sentinel file's ownership — the probe container did not run. This is an infrastructure failure in this step, not an entrypoint.sh regression."
            exit 1
          fi
          if [ "$write_rc" -ne 0 ]; then
            echo "::error::The server user cannot write a restored database. entrypoint.sh left /app/data/spendrop.db owned by someone other than PUID:PGID, which breaks every restore. Check that its ownership guard probes the DATABASE FILES and not only the /app/data directory — a restored file lands root-owned inside a directory that already has the right owner, so a directory-only guard sees a match and skips the chown."
            exit 1
          fi
          if [ "$sentinel" != "0:0" ]; then
            echo "::error::entrypoint.sh ran a recursive chown on a boot where every path it probes was already correctly owned (a sentinel inside /app/data/backups was rewritten to ${sentinel}). That sweep is O(files) and grows with every backup and migration snapshot, so it slows every boot on a large volume. Keep the guard: sweep only when a probed path actually mismatches."
            exit 1
          fi
