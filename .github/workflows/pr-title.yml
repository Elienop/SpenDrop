name: PR Title

# Lints the PR title against the Conventional Commits format. This matters
# beyond style: SpenDrop squash-merges with the PR title as the commit subject
# (the repo's squash_merge_commit_title = COMMIT_OR_PR_TITLE → PR title for any
# multi-commit PR), and the release job in main.yml
# (mathieudutour/github-tag-action, default_bump: patch) reads that subject to
# pick the semver bump:
#   feat: → minor   fix: → patch   a breaking change → major   anything else → patch
# So a non-conventional title (e.g. the branch-name default "Feat/foo bar")
# silently ships a feature as a patch bump. Enforcing the title here keeps the
# release version honest.
#
# Kept in its own workflow (not pr.yml) so the `edited` trigger re-validates
# when a title is fixed, without re-running the heavy build/test/docker jobs.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commit types SpenDrop uses. `feat`/`fix` drive the
          # release bump; the rest are valid but bump patch (the default).
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            style
            revert
          # Scope (e.g. `feat(web):`) is allowed but not required.
          requireScope: false
