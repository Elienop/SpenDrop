name: PR

# Thin caller: all gates live in the reusable ci.yml workflow so PR CI and the
# push-to-main release pipeline (main.yml) run byte-identical checks and can
# never drift. Add new gates in ci.yml, not here.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
