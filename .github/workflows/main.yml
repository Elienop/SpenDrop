name: Docker Image CI

on:
  push:
    branches: [main]

# Serialize release runs so two near-simultaneous pushes to main can't push
# image vX while the other creates git tag vX+1 (the dry-run version step and
# the real-tag step are separate, widening that window). cancel-in-progress is
# false because cancelling a run mid-build/push could orphan a pushed image or a
# half-created tag — serialize, never interrupt.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Run the full gate suite (Go build/vet/schema-drift/test, frontend
  # tsc/vitest/eslint, docker build) before anything ships. This is the exact
  # same reusable workflow pr.yml invokes, so a push-to-main release is gated
  # on identical checks to a PR — no more shipping :latest after only
  # `go test -race`. `needs: gates` on the release job blocks the release
  # unless every gate passed.
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # 1. COMPUTE the next version + changelog only — dry_run means NO git tag
      #    is created yet. The outputs (new_tag/new_version/changelog) are still
      #    populated, so we can build with the computed tag before committing
      #    to it. This closes the orphaned-tag hole: previously the tag was
      #    created BEFORE build/push, so a build/push failure left a published
      #    semver tag (and release) pointing at an image that never reached
      #    ghcr, and the next push bumped from that orphan, skipping a version.
      - name: Compute next version (dry run)
        id: version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          dry_run: true

      # 2. Build with the computed tag.
      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile \
            --tag ghcr.io/elienop/spendrop:${{ steps.version.outputs.new_tag }} \
            --tag ghcr.io/elienop/spendrop:latest

      # 3. Push. If THIS fails, no git tag and no release exist yet, so the next
      #    push retries cleanly from the prior good tag (no skipped version).
      - name: Push the Docker image to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/elienop/spendrop:${{ steps.version.outputs.new_tag }}
          docker push ghcr.io/elienop/spendrop:latest

      # 4. Image is live → NOW create + push the real git tag. No commits land
      #    between the dry run and here within one job run, so the bump is
      #    recomputed to the same value and the git tag stays in lockstep with
      #    the pushed image tag.
      - name: Create and push tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      # 5. Release last, against the now-existing tag + live image.
      - name: Create a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: ${{ steps.tag.outputs.new_tag }}
          tag: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.version.outputs.changelog }}
          generateReleaseNotes: true
