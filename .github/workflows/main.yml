name: Docker Image CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Build the Docker image
        run: |
          docker build . --file Dockerfile \
            --tag ghcr.io/elienop/spendrop:${{ steps.tag.outputs.new_tag }} \
            --tag ghcr.io/elienop/spendrop:latest

      - name: Push the Docker image to GitHub Container Registry
        run: |
          echo ${{ secrets.CLASSIC_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/elienop/spendrop:${{ steps.tag.outputs.new_tag }}
          docker push ghcr.io/elienop/spendrop:latest

      - name: Create a release
        uses: ncipollo/release-action@v1.20.0
        with:
          name: ${{ steps.tag.outputs.new_tag }}
          tag: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          generateReleaseNotes: true
